# =============================================================================
# Kandarp OS - Oracle Cloud deployment
# =============================================================================
# Required repository/environment secrets:
#   ORACLE_HOST       Public DNS name or IP of the Oracle server
#   ORACLE_USER       SSH user with Docker Compose access
#   ORACLE_SSH_KEY    Private SSH key for that user
#   ORACLE_APP_DIR    Absolute checkout path on the server
# Optional:
#   ORACLE_PORT       SSH port (defaults to 22)
# Required production variable:
#   PRODUCTION_URL    Public HTTPS origin, without a trailing slash
#
# The server must already have Docker Engine, Compose v2, Git, and a checkout
# of this repository. This workflow never writes application secrets to GitHub
# logs or the repository; runtime secrets remain in the server-side .env file.
# =============================================================================

name: Deploy Oracle Production

on:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: oracle-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Oracle Cloud
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: production
            url: ${{ vars.PRODUCTION_URL }}

        steps:
            - name: Checkout deployment revision
              uses: actions/checkout@v4

            - name: Configure SSH
              shell: bash
              env:
                  ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
              run: |
                  set -euo pipefail
                  test -n "$ORACLE_SSH_KEY"
                  install -d -m 700 "$HOME/.ssh"
                  printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/oracle_deploy_key"
                  chmod 600 "$HOME/.ssh/oracle_deploy_key"
                  ssh-keyscan -p "${{ secrets.ORACLE_PORT || 22 }}" -H "${{ secrets.ORACLE_HOST }}" >> "$HOME/.ssh/known_hosts"

            - name: Deploy and verify
              shell: bash
              env:
                  ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
                  ORACLE_USER: ${{ secrets.ORACLE_USER }}
                  ORACLE_PORT: ${{ secrets.ORACLE_PORT || 22 }}
                  ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
                  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
                  DEPLOY_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  test -n "$ORACLE_HOST"
                  test -n "$ORACLE_USER"
                  test -n "$ORACLE_APP_DIR"
                  test -n "$PRODUCTION_URL"

                  ssh -i "$HOME/.ssh/oracle_deploy_key" \
                    -p "$ORACLE_PORT" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    "$ORACLE_USER@$ORACLE_HOST" \
                    bash -s -- "$ORACLE_APP_DIR" "$PRODUCTION_URL" "$DEPLOY_SHA" <<'REMOTE'
                  set -euo pipefail
                  APP_DIR="$1"
                  EXPECTED_URL="$2"
                  DEPLOY_SHA="$3"
                  cd "$APP_DIR"
                  test -f docker-compose.server.yml
                  test -f .env
                  git fetch --prune origin main

                  # The server checkout is deployment-only. Force the exact immutable
                  # revision so a stale tracked file cannot block an otherwise valid release.
                  # Untracked runtime files such as .env and uploaded media are preserved.
                  git checkout --force --detach "$DEPLOY_SHA"
                  test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

                  # Build before the migration preflight so the checked-in Prisma CLI and
                  # migrations match the revision that will receive production traffic.
                  docker compose -f docker-compose.server.yml build app
                  docker compose -f docker-compose.server.yml up -d db
                  docker compose -f docker-compose.server.yml run --rm app \
                    node node_modules/prisma/build/index.js migrate deploy
                  docker compose -f docker-compose.server.yml up -d --no-build --force-recreate app

                  # Check the application through the host loopback first. This diagnoses
                  # container failures independently of DNS, TLS, CDN, and nginx state.
                  for attempt in $(seq 1 24); do
                    if curl --fail --silent --show-error \
                      "http://127.0.0.1:3000/api/health/ready" >/dev/null; then
                      break
                    fi
                    if [ "$attempt" -eq 24 ]; then
                      docker compose -f docker-compose.server.yml ps
                      docker compose -f docker-compose.server.yml logs --tail=200 app
                      exit 1
                    fi
                    sleep 5
                  done

                  # Verify the public reverse-proxy path without depending on mutable CMS
                  # content. A streamed Next.js not-found response carries the 404 document
                  # with HTTP 200 because headers are committed before the segment resolves.
                  curl --fail --silent --show-error "$EXPECTED_URL/api/health/live" >/dev/null
                  curl --fail --silent --show-error "$EXPECTED_URL/api/health/ready" >/dev/null
                  curl --fail --silent --show-error "$EXPECTED_URL/" >/dev/null
                  missing_body="$(mktemp)"
                  missing_status="$(curl --silent --show-error --output "$missing_body" --write-out '%{http_code}' "$EXPECTED_URL/blog/does-not-exist")"
                  if [ "$missing_status" != "404" ]; then
                    grep -q 'NEXT_HTTP_ERROR_FALLBACK;404\|// 404' "$missing_body"
                  fi
                  rm -f "$missing_body"
                  REMOTE
